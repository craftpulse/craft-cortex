name: Code Analysis

on:
  pull_request: null
  push:
    branches:
      - develop-v5
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code_analysis:
    strategy:
      fail-fast: false
      matrix:
        actions:
          - name: 'PHPStan'
            run: composer phpstan
          - name: 'Coding Standards'
            run: composer check-cs
    name: ${{ matrix.actions.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: 'ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          tools: composer:v2
      - name: Register craft-audit-kit VCS repository
        run: composer config repositories.craft-audit-kit vcs https://github.com/craftpulse/craft-audit-kit.git
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - run: ${{ matrix.actions.run }}

  # Herald's suite does NOT use markhuot/craft-pest-core, so nothing
  # self-installs Craft for it. `tests/Bootstrap.php` boots the console
  # application of a *surrounding* Craft install, located via
  # `HERALD_TEST_CRAFT_BASE`, and the tools under test introspect that
  # install's live API surface (sections, fields, volumes, registered
  # element types). This job therefore has to build a real Craft install
  # before Pest can run. The harness needs, in order:
  #
  #   1. a MySQL 8 service and a database Craft can install into,
  #   2. a Craft project with the plugin required in from this checkout,
  #      so `craftcms/plugin-installer` registers it and
  #      `Herald::getInstance()` resolves,
  #   3. an installed Craft schema plus one admin user, which the
  #      permission and CP-controller tests act as (resolved by flag via
  #      the `herald_admin_user()` helper in `tests/Pest.php`, never by
  #      username, so no CI-specific account name is baked in),
  #   4. the plugin's own vendor directory, because the canonical
  #      invocation is plugin-local: Pest runs from the plugin root with
  #      its own binary so a conflicting Pest or craft-pest-core in the
  #      surrounding install's vendor can never hijack the run,
  #   5. the content fixtures, because a tier of tests asserts against
  #      named content rather than response shape.
  #
  # The fixture step installs the contract documented in
  # `tests/fixtures/FixtureInstaller.php`: the `heroes` / `minorHeroes` /
  # `teams` / `about` sections, 13 fields, the `images` volume, the
  # `factions` category group, the `infinityStones` tag group, the
  # `shieldDirective` global set, 150 `Minor Hero %04d` entries, two
  # referenced assets, and the `nfury` and activity-viewer users. It
  # mirrors the dev playground's Marvel seed handle for handle, so both
  # runners satisfy the same assertions. It must run after the edition is
  # set to Pro (Solo permits exactly one user) and it never creates a
  # site: `AuditFixModesTest` asserts `repair_propagation` finds zero
  # propagation gaps, which only holds on a single-site install.
  #
  # The fixture step is itself a gate: `test:fixtures` exits non-zero
  # unless every invariant it evaluates is satisfied, and it prints the
  # ones that are not. A fixture regression therefore fails as a fixture
  # failure rather than as a wall of skipped tests.
  #
  # ZERO-SKIP GATE - NOT YET ARMED. `composer test:ci` runs Pest with
  # `--fail-on-skipped`, and the fixtures take the skip count from 168 to
  # 1. The remaining skip is not a fixture gap: it is cross-test
  # contamination. `tests/Migrations/KebabCasePermissionsTest`'s cleanup
  # deletes the `herald:view-activity` row from `userpermissions`
  # wholesale, which cascades away any grant on it, and
  # `tests/Plugin/CpNavItemTest` runs after that file in the default
  # order and needs a non-admin holding exactly that permission. No
  # fixture can survive it: the cascade takes user grants and group
  # grants alike. That test file's own docblock states the assumption it
  # relies on, "the playground carries no Herald grants at baseline",
  # which the fixtures necessarily invalidate.
  #
  # Arming this is a one-line change (`composer test` ->
  # `composer test:ci`) once that cleanup is scoped to the permission ids
  # it created, which is the pattern the same file already uses for its
  # own `$createdIds`. Until then the gate stays available but unarmed,
  # because a permanently red required check trains people to ignore it.
  #
  # If `--fail-on-skipped` ever stops being honoured through Pest, the
  # fallback is `pest --log-junit junit.xml` plus a grep asserting the
  # file contains no `<skipped` elements.
  #
  # Note also that the suite consumes the activity-viewer grant, so a
  # second local run needs `composer test:fixtures` again.
  pest:
    name: Pest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('plugin/composer.json') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: 'ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,pdo_mysql,reflection,spl,zip'
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          tools: composer:v2

      # `--no-scripts` skips the starter project's interactive
      # `setup/welcome` post-create hook; the environment is written
      # explicitly in the next step instead.
      - name: Create the surrounding Craft install
        run: composer create-project craftcms/craft cms --no-interaction --no-ansi --no-progress --no-scripts

      - name: Write the Craft environment
        working-directory: cms
        run: |
          cat > .env <<'ENV'
          CRAFT_APP_ID=herald-ci
          CRAFT_ENVIRONMENT=dev
          CRAFT_DEV_MODE=true
          CRAFT_ALLOW_ADMIN_CHANGES=true
          CRAFT_SECURITY_KEY=ci-only-not-a-secret
          CRAFT_DB_DRIVER=mysql
          CRAFT_DB_SERVER=127.0.0.1
          CRAFT_DB_PORT=3306
          CRAFT_DB_DATABASE=db_test
          CRAFT_DB_USER=root
          CRAFT_DB_PASSWORD=root
          CRAFT_DB_TABLE_PREFIX=
          PRIMARY_SITE_URL=http://localhost:8080
          ENV

      # The path repository resolves the plugin from this checkout, so the
      # suite always tests the pushed code rather than a published tag.
      - name: Require the plugin into the Craft install
        working-directory: cms
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.craft-audit-kit vcs https://github.com/craftpulse/craft-audit-kit.git
          composer config repositories.craft-herald path ../plugin
          composer require craftpulse/craft-herald:@dev --no-interaction --no-ansi --no-progress

      - name: Install Craft
        working-directory: cms
        run: |
          php craft install/craft \
            --interactive=0 \
            --username=admin \
            --email=admin@example.test \
            --password=Password123! \
            --siteName=Herald \
            --siteUrl=http://localhost:8080 \
            --language=en-US

      # Craft installs as Solo, which permits exactly one user account.
      # The permission, OAuth, and CP-controller suites all create extra
      # user fixtures, and on Solo `saveElement()` fails, leaving a null
      # id that surfaces as a foreign-key violation rather than an
      # edition error. Pro is the edition the suite is written against.
      - name: Set the Craft edition to Pro
        working-directory: cms
        run: php craft exec 'Craft::$app->setEdition(\craft\enums\CmsEdition::Pro)'

      - name: Install the Herald plugin
        working-directory: cms
        run: php craft plugin/install herald --interactive=0

      # Herald's own documented setup step. The OAuth service throws
      # `InvalidConfigException` naming this command when the keypair is
      # absent, so the HTTP-transport and token suites need it to exist.
      - name: Generate the OAuth signing keypair
        working-directory: cms
        run: php craft herald/oauth/init-keys

      - name: Install the plugin's own dependencies
        working-directory: plugin
        run: |
          composer config repositories.craft-audit-kit vcs https://github.com/craftpulse/craft-audit-kit.git
          composer install --no-interaction --no-ansi --no-progress

      # Same contract as the Pest step below: run from the plugin root,
      # locate the Craft install through `HERALD_TEST_CRAFT_BASE`.
      - name: Install the Herald content fixtures
        working-directory: plugin
        env:
          HERALD_TEST_CRAFT_BASE: ${{ github.workspace }}/cms
        run: composer test:fixtures

      # Run from the plugin's own root, through its own Pest binary. The
      # bootstrap finds the Craft install through `HERALD_TEST_CRAFT_BASE`
      # rather than the working directory. Swap `test` for `test:ci` to arm
      # the zero-skip gate; see the note above the job for what blocks it.
      - name: Run Pest
        working-directory: plugin
        env:
          HERALD_TEST_CRAFT_BASE: ${{ github.workspace }}/cms
        run: composer test
